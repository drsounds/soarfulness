name: Native Android build

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-android-build.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-android-build.yml"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to submit to (only used when GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is set)"
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    # `secrets` isn't a recognized context inside step `if:` conditionals
    # (confirmed via the Actions API's own workflow validation - "Unrecognized
    # named-value: 'secrets'"). Booleans computed here in job-level `env:`
    # *can* read secrets, and `env` *is* usable in `if:`, so gate steps on
    # these instead of referencing secrets.* directly in if:.
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SUBMIT: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The previous run failed with "No space left on device" mid-build
      # (see native/NATIVE_APP.md) - GitHub-hosted ubuntu-latest runners ship
      # with large preinstalled toolchains this project doesn't use (.NET,
      # GHC, CodeQL bundles) eating into the ~14GB normally free. Removing
      # them here, before anything else needs disk, reclaims tens of GB.
      #
      # /usr/local/lib/android needs care: the runner pre-bakes it (and only
      # it, not its root-owned parent /usr/local/lib) writable by the
      # unprivileged runner user, so the later `Set up Android SDK` step can
      # recreate whatever it needs under there without sudo. Two earlier
      # attempts at cleaning it up both broke that: deleting the directory
      # itself lost the special ownership on /usr/local/lib/android; deleting
      # just its contents lost it one level down instead, on the `sdk`
      # subdirectory specifically (same EACCES failure, just relocated) -
      # the ownership boundary isn't at a fixed, guessable depth. `chown -R`
      # to the runner user *before* clearing sidesteps that entirely: every
      # directory recreated under here afterwards, at any depth, is already
      # owned by the same user doing the recreating.
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo chown -R "$(id -u):$(id -g)" /usr/local/lib/android && rm -rf /usr/local/lib/android/* || true
          echo "After cleanup:"
          df -h /

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      # Skipped when a signed release AAB is also being built below - the
      # debug APK only exists to prove the build compiles on forks/PRs
      # without the signing secret, and every artifact upload eats into the
      # repo's (limited) GitHub Actions storage quota, so we don't upload
      # both when only the AAB is actually needed.
      - name: Upload APK artifact
        if: ${{ env.HAS_ANDROID_SIGNING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aqua-wave-dream-debug-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      # Play Store release build - only runs when the upload keystore secret
      # is configured (see native/NATIVE_APP.md). Skipped entirely otherwise,
      # so forks/PRs without the secret still get the debug APK above.
      - name: Decode upload keystore
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release AAB (signed)
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        working-directory: native/android
        env:
          ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB artifact
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aqua-wave-dream-release-aab
          path: native/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3

      # Play Store submission - only runs when both the signing secret above
      # AND the Play Developer API service account secret are configured.
      # Requires a manual first upload through the Play Console web UI before
      # this can ever succeed (the Play Developer API rejects uploads for a
      # packageName it hasn't seen a release for yet) - see
      # native/NATIVE_APP.md. Defaults to the "internal" track on automatic
      # (push-triggered) runs; use workflow_dispatch to target a different
      # track deliberately - this never defaults to "production" on its own.
      - name: Submit to Play Store
        if: ${{ env.HAS_PLAY_SUBMIT == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: se.aquafulness.app.gen7
          releaseFiles: native/android/app/build/outputs/bundle/release/*.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: completed
