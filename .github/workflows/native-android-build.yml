name: Native Android build

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-android-build.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-android-build.yml"
  workflow_dispatch:

jobs:
  android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqua-wave-dream-debug-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Play Store release build - only runs when the upload keystore secret
      # is configured (see native/NATIVE_APP.md). Skipped entirely otherwise,
      # so forks/PRs without the secret still get the debug APK above.
      - name: Decode upload keystore
        if: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release AAB (signed)
        if: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        working-directory: native/android
        env:
          ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB artifact
        if: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aqua-wave-dream-release-aab
          path: native/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
