name: Build Capacitor web bundle

# Reusable workflow: builds the offline web bundle the Capacitor Android app
# ships (`build:capacitor` + `cap sync android`) and uploads
# android/app/src/main/assets, tarred, as the `capacitor-web-bundle` build
# artifact of the calling run. Consumed by capacitor-android-build.yml (which
# extracts it before running Gradle) and publish-capacitor-web-bundle.yml
# (which attaches it to the stable "capacitor-web-bundle" GitHub Release).
# See CAPACITOR_APP.md's "Building the offline web bundle" section.
on:
  workflow_call:
    inputs:
      ref:
        description: Branch/tag/SHA to build from (defaults to the caller's ref)
        type: string
        required: false
        default: ""
    outputs:
      artifact-name:
        description: Name of the uploaded build artifact
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    outputs:
      artifact-name: capacitor-web-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Node is still needed alongside bun — vite and
      # scripts/capacitor-snapshot-shell.mjs (which boots the built
      # node-server via process.execPath) run on it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun, not npm: bun.lock is the lockfile kept in sync with
      # package.json; `npm ci` fails on a missing/drifted package-lock.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build:capacitor

      # Copies .output/public plus capacitor.config.json/capacitor.plugins.json
      # into android/app/src/main/assets — exactly what the APK ships.
      - name: Sync into the Android project
        run: bunx cap sync android

      # The APK pulls live updates from, and builds shared links to, the
      # self-hosted site (capacitor.config.ts's plugins.LiveUpdate.url and
      # src/lib/appLinks.ts's PUBLIC_APP_URL). Fail rather than ship an app
      # that silently keeps updating from somewhere else.
      - name: Check the bundle points at the self-hosted site
        env:
          EXPECTED_URL: https://soarfulness.app.spacify.se
        run: |
          set -eu
          config=android/app/src/main/assets/capacitor.config.json
          actual="$(jq -r '.plugins.LiveUpdate.url' "$config")"
          if [ "$actual" != "$EXPECTED_URL" ]; then
            echo "::error::$config has plugins.LiveUpdate.url=$actual, expected $EXPECTED_URL (see capacitor.config.ts)."
            exit 1
          fi
          if ! grep -rqF "$EXPECTED_URL" android/app/src/main/assets/public/assets; then
            echo "::error::The built web app doesn't reference $EXPECTED_URL (PUBLIC_APP_URL in src/lib/appLinks.ts)."
            exit 1
          fi
          echo "Live updates and shared links point at $EXPECTED_URL"

      # One tarball rather than the raw directory: thousands of small files
      # upload/download far slower as an artifact than a single file.
      - name: Package assets
        run: |
          tar czf capacitor-android-assets.tar.gz -C android/app/src/main/assets .
          ls -lh capacitor-android-assets.tar.gz

      # Already gzipped, so skip the artifact zip's own compression. Short
      # retention: it's only needed by the later jobs of this same run, and
      # ~120MB per run adds up against the Actions storage quota.
      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-web-bundle
          path: capacitor-android-assets.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
