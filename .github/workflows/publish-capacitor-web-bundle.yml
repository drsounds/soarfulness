name: Publish Capacitor web bundle

on:
  # Manual only. Builds the offline web bundle via
  # build-capacitor-web-bundle.yml (as a build artifact of this run) and
  # attaches it to the stable "capacitor-web-bundle" GitHub Release, so
  # there's always a downloadable copy of the current bundle outside any
  # single run. capacitor-android-build.yml builds its own copy the same way
  # rather than depending on this release.
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch/tag/SHA to build the bundle from (defaults to the ref this workflow is run on)
        required: false
        default: ""

jobs:
  web-bundle:
    name: Web bundle
    uses: ./.github/workflows/build-capacitor-web-bundle.yml
    with:
      ref: ${{ github.event.inputs.source_ref }}

  publish:
    name: Publish release asset
    needs: web-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download web bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.web-bundle.outputs.artifact-name }}

      - name: Publish/update the capacitor-web-bundle release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: capacitor-web-bundle
          name: Capacitor web bundle
          body: >-
            Prebuilt offline web bundle for the Capacitor Android app
            (android/app/src/main/assets contents). Not a product release.
            Built by build-capacitor-web-bundle.yml; see CAPACITOR_APP.md.
          prerelease: true
          make_latest: false
          files: capacitor-android-assets.tar.gz
